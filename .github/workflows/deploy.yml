name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ops-automation-kit is private and this repo is public: GitHub refuses `uses:` of a private
      # repo's actions from a public one, so fetch the kit at the pinned tag with its deploy key.
      - uses: 1password/load-secrets-action@v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AUTOMATION_KIT_DEPLOY_KEY_B64: op://ELC Automation/AUTOMATION_KIT_DEPLOY_KEY_B64/credential

      - name: Fetch automation-kit
        run: |
          k="$RUNNER_TEMP/kit_key"; printf '%s' "$AUTOMATION_KIT_DEPLOY_KEY_B64" | base64 -d > "$k"; chmod 600 "$k"
          GIT_SSH_COMMAND="ssh -i $k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 --branch v1.0.3 git@github.com:marian-kamenistak/ops-automation-kit.git .automation-kit
          rm -f "$k"

      # 1Password → Worker secrets (.op-secrets) → npm ci → gates → wrangler deploy.
      # worker-configuration.d.ts (Cloudflare Workers ambient runtime types) is gitignored
      # and only exists on Marian's Mac because `wrangler types` was already run there, so
      # cf-typegen runs before type-check. card:check stays laptop-only (it reads the sibling mc-web checkout).
      - name: Test, type-check and deploy
        uses: ./.automation-kit/actions/deploy-worker
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          checkout: 'false'
          pre-deploy: npm test && npm run cf-typegen && npm run type-check

      - name: Smoke check — tools/list
        run: |
          set -euo pipefail
          sleep 5
          url="https://www.marian.coach/mcp"
          # McpAgent hosts require an mcp-session-id, minted by an initialize call, on
          # every subsequent request — tools/list included.
          headers=$(curl -sf -X POST "$url" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke-check","version":"1.0"}}}' \
            -D - -o /dev/null)
          session=$(echo "$headers" | grep -i "^mcp-session-id:" | sed -E 's/^[^:]+: *//;s/\r//')
          [ -n "$session" ] || { echo "::error::initialize did not return an mcp-session-id"; exit 1; }
          resp=$(curl -sf -X POST "$url" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -H "mcp-session-id: $session" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          echo "$resp" | grep -q '"get_started"' || { echo "::error::tools/list missing get_started"; exit 1; }
          echo "smoke check passed"

      - if: always()
        uses: ./.automation-kit/actions/report-and-register
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          status: ${{ job.status }}
