# job.yaml (P3-REGISTRY). Format + rules: agentic-os projects/briefs/automation-visibility/phase2/job-yaml-schema.md
# Check: node ~/ai/_platform/control-room/scripts/registry.ts check <this file>
schema: 1
id: eng-leadership-toolkit
catalogue_id: CF-10 eng-leadership-toolkit
title: Toolkit MCP uptime probe (every 15 min)
status: active
streams: [mc]
purpose: check
entity: null
owner: marian
sender: none
runtime:
  kind: worker
  repo: marian-kamenistak/ai-engineering-leader-toolkit
  path: .
  entry: eng-leadership-toolkit
schedule:
- owner: native
  cron: '*/15 * * * *'
  tz: UTC
  grace_min: 720
kpi:
  name: probe pass rate (7 d)
  unit: percent
  target: 99
  warn: 97
  direction: gte
test:
  command: npm test
  dry_run: npx wrangler deploy --dry-run --outdir "$(mktemp -d)"
autofix:
  allowed: false
  max_attempts: 0
manual_minutes_per_run: 0
manual_minutes_source: estimate
docs: CLAUDE.md
# operating standard (playbook section 14), 2026-11-14
triage: approval
depends_on: []
runbook:
- 'Open the job page: a failed run names the check that failed (mentoring docs GET or MCP initialize POST on marian.coach/mcp/mentoring).'
- Each check is retried once; a failed run is paged once by control-room (#warning-bot) and sits in the fix queue.
- 'Check the marian.coach/mcp/mentoring route and the mentoring-inquiry-builder Worker first: this probe watches the sibling, not itself.'
- Pause the probe from its control-room page during a planned deploy; it reports paused, not failed.
- The code is src/index.ts and src/uptime.ts; the Worker deploys from GitHub Actions on push to main.
inputs:
- name: mentoring-inquiry-builder public endpoint (marian.coach/mcp/mentoring)
  max_age: 15m
  source: live HTTPS probe, nothing stored
budget: null # n.a.: no LLM, credits or paid API
